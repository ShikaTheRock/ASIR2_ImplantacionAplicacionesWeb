
services:
  web:
    image: php:8.3-apache
    container_name: lamp_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - apache_logs:/var/log/apache2
      - ./src/apache-logs.conf:/etc/apache2/conf-enabled/goaccess.conf:ro
      - ./src/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      bash -c "
      chmod -R a+rX /var/www/html &&
      if [ ! -f /var/www/html/index.php ] && [ ! -f /var/www/html/index.html ]; then
        printf '%s\n' '<?php echo \"Servidor LAMP funcionando correctamente\"; ?>' > /var/www/html/index.php;
      fi &&
      docker-php-ext-install mysqli pdo_mysql &&
      apache2-foreground
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lamp_network
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: lamp_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lamp_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lamp_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lamp_network
    restart: unless-stopped

  goaccess:
    image: allinurl/goaccess:latest
    container_name: lamp_goaccess
    user: "0:0"
    ports:
      - "7890:7890"
    volumes:
      - apache_logs:/var/log/apache2:ro
      - ./src:/var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -f /var/log/apache2/goaccess.log ]; do
          sleep 2
        done
        tail -F -n +1 /var/log/apache2/goaccess.log | goaccess --log-format=COMBINED --output=/var/www/html/report.html --real-time-html --ws-url=localhost:7890 --port=7890 -
    depends_on:
      - web
    networks:
      - lamp_network
    restart: unless-stopped


volumes:
  db_data:
  apache_logs:

networks:
  lamp_network:
    driver: bridge

